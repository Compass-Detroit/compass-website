<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <!-- Detroit riverfront at sunset, after the DevFest '26 flyer -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.35" stop-color="#5b4a9e"/>
      <stop offset="0.55" stop-color="#d9708a"/>
      <stop offset="0.68" stop-color="#ff9a4d"/>
      <stop offset="0.72" stop-color="#ffc56b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="0.25" stop-color="#c76a5e"/>
      <stop offset="0.7" stop-color="#2c2f6e"/>
      <stop offset="1" stop-color="#0d1435"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.45" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2550"/>
      <stop offset="1" stop-color="#14183a"/>
    </linearGradient>
    <pattern id="win" width="8" height="10" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="3" height="4" fill="#ffcf7a" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="600" height="580" fill="url(#sky)"/>
  <circle cx="150" cy="560" r="90" fill="url(#sun)"/>
  <circle cx="150" cy="560" r="26" fill="#fff1c4"/>

  <!-- distant skyline -->
  <g fill="#3a3466" opacity="0.85">
    <rect x="0" y="500" width="40" height="80"/>
    <rect x="36" y="470" width="28" height="110"/>
    <rect x="230" y="455" width="30" height="125"/>
    <rect x="470" y="470" width="34" height="110"/>
    <rect x="540" y="490" width="60" height="90"/>
  </g>

  <!-- Renaissance Center -->
  <g fill="url(#bldg)">
    <rect x="300" y="300" width="56" height="280" rx="10"/>
    <rect x="262" y="380" width="36" height="200" rx="8"/>
    <rect x="358" y="380" width="36" height="200" rx="8"/>
    <rect x="245" y="410" width="22" height="170" rx="6"/>
    <rect x="390" y="410" width="22" height="170" rx="6"/>
    <rect x="320" y="282" width="16" height="22"/>
  </g>
  <g fill="url(#win)">
    <rect x="304" y="310" width="48" height="270"/>
    <rect x="266" y="390" width="28" height="190"/>
    <rect x="362" y="390" width="28" height="190"/>
  </g>

  <!-- downtown blocks -->
  <g fill="url(#bldg)">
    <rect x="70" y="430" width="40" height="150"/>
    <rect x="108" y="400" width="34" height="180"/>
    <polygon points="108,400 125,370 142,400"/>
    <rect x="180" y="440" width="44" height="140"/>
    <rect x="420" y="420" width="38" height="160"/>
    <rect x="455" y="390" width="30" height="190"/>
    <polygon points="455,390 470,350 485,390"/>
    <rect x="500" y="450" width="46" height="130"/>
  </g>
  <g fill="url(#win)" opacity="0.8">
    <rect x="112" y="410" width="26" height="170"/>
    <rect x="184" y="450" width="36" height="130"/>
    <rect x="458" y="400" width="24" height="180"/>
  </g>

  <!-- riverfront -->
  <rect y="578" width="600" height="6" fill="#0f1433"/>
  <rect y="584" width="600" height="216" fill="url(#water)"/>
  <g stroke="#ffd58a" stroke-linecap="round" opacity="0.55">
    <line x1="110" y1="600" x2="190" y2="600" stroke-width="3"/>
    <line x1="90" y1="622" x2="210" y2="622" stroke-width="2"/>
    <line x1="120" y1="648" x2="180" y2="648" stroke-width="2"/>
    <line x1="300" y1="610" x2="356" y2="610" stroke-width="2"/>
    <line x1="292" y1="640" x2="364" y2="640" stroke-width="1.5"/>
    <line x1="130" y1="680" x2="170" y2="680" stroke-width="1.5"/>
    <line x1="310" y1="690" x2="346" y2="690" stroke-width="1"/>
  </g>
</svg>
